name: Feature request
description: Suggest a new capability, method, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem before the solution.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions
          required: true
        - label: This request is not asking for help attacking a third-party target
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Layer 7 method
        - Layer 4 method
        - Amplification
        - Proxy handling
        - Tools console
        - Web panel
        - Docker
        - Documentation or wiki
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the current limitation or friction
      placeholder: I am trying to ... but ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should MHDDoS do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or tools
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and impact
      description: Which platforms, layers, or files would change?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or examples
    validations:
      required: false
