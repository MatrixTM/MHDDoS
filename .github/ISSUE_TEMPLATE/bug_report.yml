name: Bug report
description: Something in MHDDoS is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Before you continue, run `python start.py DOCTOR` and include the output.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate
          required: true
        - label: I am reporting a bug in MHDDoS, not asking for help attacking a target
          required: true
        - label: I removed proxy credentials, tokens, and private keys from this report
          required: true

  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - 2.4.9
        - 2.4.8
        - 2.4.7
        - main branch
        - older release
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Layer 7 method
        - Layer 4 method
        - Amplification
        - Proxy handling
        - Tools console
        - Web panel
        - Docker
        - Wiki
        - Other
    validations:
      required: true

  - type: input
    id: method
    attributes:
      label: Method or command
      description: The method name or command that failed, if relevant
      placeholder: e.g. GET, DNS, MCBOT, DOCTOR
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in what you have. Do not paste secrets.
      value: |
        - OS:
        - Python:
        - Install method: source / Docker / release archive
        - Docker version:
        - Node version:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, with credentials and target details removed
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error or traceback, not just the last line
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install with ...
        2. Run ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: DOCTOR output
      description: Paste `python start.py DOCTOR`
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Add debug output if the command supports it
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, related issues, or a suggested fix
    validations:
      required: false
